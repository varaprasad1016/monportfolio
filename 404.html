<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Mounika Kallepalli</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --text:#10151a; --text-2:#46515b; --accent:#0f6f6c; --accent-hover:#0b5a57; --ink:#fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0f12; --text:#edf1f4; --text-2:#a9b4bd; --accent:#3bb7af; --accent-hover:#5cc8c1; --ink:#062321; color-scheme: dark; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-align:center; }
  p.code { font-family:'JetBrains Mono',monospace; font-size:.8125rem; letter-spacing:.1em; color:var(--accent); }
  h1 { margin-top:12px; font-size:clamp(1.875rem,5vw,2.5rem); font-weight:600; letter-spacing:-.028em; }
  p.lead { margin-top:12px; color:var(--text-2); }
  a { display:inline-flex; align-items:center; height:44px; margin-top:28px; padding:0 20px; border-radius:10px;
      background:var(--accent); color:var(--ink); font-weight:500; text-decoration:none; }
  a:hover { background:var(--accent-hover); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code">404 — NOT FOUND</p>
  <h1>This page doesn't exist</h1>
  <p class="lead">The link may be out of date. The portfolio is one click away.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
